# Local stack. Run through the Makefile (`make up`, `make live`), which passes --env-file .env.
name: harbor-haze

x-app: &app
  image: harbor-haze/app:dev
  build:
    context: ../..
    dockerfile: infra/docker/app/Dockerfile
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
    AIRNOW_API_KEY: ${AIRNOW_API_KEY:-}
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-4g}
  volumes:
    - ../../config:/app/config:ro
    - ../../data:/app/data
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    <<: *app
    command: ["python", "-m", "harbor_haze.streaming.topics"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  console:
    image: redpandadata/console:v3.11.0
    ports:
      - "${CONSOLE_PORT:-8085}:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # --- warehouse (Postgres star schema; load with `make warehouse-load`) -------------
  warehouse-pg:
    image: postgres:16
    container_name: harbor-warehouse-pg
    environment:
      POSTGRES_USER: ${WAREHOUSE_PG_USER:-harbor}
      POSTGRES_PASSWORD: ${WAREHOUSE_PG_PASSWORD:-harbor}
      POSTGRES_DB: ${WAREHOUSE_PG_DB:-harbor_haze}
    ports:
      - "${WAREHOUSE_PG_PORT:-5432}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_PG_USER:-harbor} -d ${WAREHOUSE_PG_DB:-harbor_haze}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- live pipeline (profile "live") -------------------------------------------------
  producer-ais:
    <<: *app
    profiles: [live]
    command: ["python", "-m", "harbor_haze.streaming.producers", "aisstream"]
    restart: on-failure:3   # exits fast with a clear message when its API key is missing

  producer-airnow:
    <<: *app
    profiles: [live]
    command: ["python", "-m", "harbor_haze.streaming.producers", "airnow"]
    restart: on-failure:3   # exits fast with a clear message when its API key is missing

  producer-nws:
    <<: *app
    profiles: [live]
    command: ["python", "-m", "harbor_haze.streaming.producers", "nws"]

  stream-bronze:
    <<: *app
    profiles: [live]
    command: ["python", "-m", "harbor_haze.streaming.kafka_to_lake"]

  stream-vessels:
    <<: *app
    profiles: [live]
    command: ["python", "-m", "harbor_haze.streaming.vessel_stream"]

volumes:
  kafka-data:
  warehouse-data:
