# Pull-request gates. These job names are the required status checks on main and dev
# (infra/github/variables.tf -> required_checks); rename them in both places.
name: ci
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch flow: feature branch -> PR into dev -> PR from dev into main. Every commit on dev/main
  # must come from a merged PR. (Also enforced by GitHub branch protection when the plan allows it.)
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: PRs follow feature -> dev -> main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::Only dev can be merged into main. Open your PR against dev."; exit 1
          fi
          if [ "$BASE" = "dev" ] && [ "$HEAD" = "main" ]; then
            echo "::error::main is never merged back into dev."; exit 1
          fi
      - name: commits on dev/main come from merged PRs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # A PR merge makes the branch tip exactly that PR's merge commit, and the PR's base is this branch.
          # A direct push (even of commits that were reviewed elsewhere) does not.
          ok=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq \
               "[.[] | select(.merged_at != null and .base.ref == \"$BRANCH\" and .merge_commit_sha == \"$SHA\")] | length")
          if [ "$ok" = "0" ]; then
            echo "::error::$SHA on $BRANCH is not the merge of a pull request into $BRANCH (direct push?)"; exit 1
          fi
          echo "ok: $SHA is a PR merge into $BRANCH"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.19"
      - name: install (locked)
        run: uv sync --frozen --python 3.11
      - name: ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: unit tests (Spark local mode, no network)
        run: uv run pytest -q
      - name: secret scan (whole git history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: touch .env && docker compose -f infra/docker/compose.yaml --env-file .env --profile live config -q
      - name: build the pipeline image
        run: docker build -f infra/docker/app/Dockerfile -t harbor-haze/app:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt + validate (no credentials; nothing is applied from CI)
        run: |
          terraform fmt -check -recursive infra
          for d in infra/github; do
            terraform -chdir=$d init -backend=false -input=false && terraform -chdir=$d validate
          done
