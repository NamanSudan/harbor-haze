# Pull-request gates. These job names are the required status checks on main
# (infra/github/variables.tf -> required_checks); rename them in both places.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.19"
      - name: install (locked)
        run: uv sync --frozen --python 3.11
      - name: ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: unit tests (Spark local mode, no network)
        run: uv run pytest -q
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: touch .env && docker compose -f infra/docker/compose.yaml --env-file .env --profile live config -q
      - name: build the pipeline image
        run: docker build -f infra/docker/app/Dockerfile -t harbor-haze/app:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt + validate (no credentials; nothing is applied from CI)
        run: |
          terraform fmt -check -recursive infra
          for d in infra/github; do
            terraform -chdir=$d init -backend=false -input=false && terraform -chdir=$d validate
          done
