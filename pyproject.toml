[project]
name = "harbor-haze"
version = "0.1.0"
description = "Does ship traffic near the Port of LA / Long Beach help predict hourly air quality?"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.8",
    "pyarrow",
    "pandas",
    "pyyaml",
    "requests",
    "websockets",
    "confluent-kafka",
    "pyshp",
    "shapely",
]

[dependency-groups]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_haze"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
